# The demo host: the app image behind Caddy, which gets and renews an HTTPS certificate.
# HTTPS matters: a phone's browser only allows microphone use on a secure address.
#
# Lives at /srv/mydata/docker-compose.yml on the host, next to:
#   .env      DOMAIN, and any other settings for this host
#   Caddyfile HTTPS proxy configuration for DOMAIN and optional DOMAIN_ALIASES
#   keys.env  service keys, written by the deploy workflow from the repository secrets
#   data/     finance.sqlite
# See deploy/README.md.
services:
  app:
    image: ${IMAGE:-ghcr.io/leonidaus/mydata-finance:latest}
    restart: unless-stopped
    env_file:
      - .env
      # Written on every deploy; later files win, so a key here replaces one in .env.
      - path: keys.env
        required: false
    volumes:
      - ./data:/data:ro
      - ./profiles:/profiles

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      DOMAIN_ALIASES: ${DOMAIN_ALIASES:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # Serve the primary name and any aliases through the same app and API.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  caddy_data:
