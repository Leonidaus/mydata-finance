# Checks every pull request and every push to develop and main.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-base:
    name: Pull request base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require develop as base
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$BASE_REF" == "develop" ]]; then
            exit 0
          fi
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" == "develop" ]]; then
            exit 0
          fi
          echo "::error::Pull requests must target develop. Only develop may target main."
          exit 1

  check:
    runs-on: craci
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # The tests use bundled fixtures and an in-memory database, so no dataset is needed.
      - name: Test
        run: npm test

      - name: Build the app
        run: npm run build

      - name: Check the data prep scripts compile
        run: python3 -m py_compile data/prep/*.py
